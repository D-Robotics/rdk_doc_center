name: Deploy Docusaurus site to GitHub Pages

on:
  push:
    branches:
      - main  # 当 main 分支有推送时触发部署
  workflow_dispatch: # 允许手动触发

# 部署串行执行，不取消进行中的任务：取消可能留下半套 gh-pages 产物
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
    # runner 到 github.com 偶发断连；先做 30 秒内的可达性探测，失败立即退出
    - name: Probe github.com egress
      run: |
        for i in 1 2 3; do
          if curl -sS --max-time 10 -o /dev/null https://github.com; then
            echo "github.com reachable (attempt $i)"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 5
        done
        echo "::error::github.com unreachable from runner"
        exit 1

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci

    # Frontend only: App ID + Search-Only key (never Admin / Write key here)
    - name: Build Docusaurus site
      env:
        ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
        ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
        # Index name is not confidential; default matches docusaurus.config.js
        ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME || 'rdk_doc_center' }}
      run: npm run build

    # Admin key scoped to this step only — do not echo or pass to build/deploy
    - name: Update Algolia index
      env:
        ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
        ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME || 'rdk_doc_center' }}
      run: npm run algolia:index

    - name: Set up Git config
      run: |
        git config --global user.email "liql01@qq.com"
        git config --global user.name "liqinglian01"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    # --skip-build：docusaurus deploy 默认会再 build 一次，而本步骤不带 ALGOLIA env，
    # 会重建出空 appId/apiKey 的产物覆盖掉上一步的正确 build/。跳过重建、直接推上一步的产物。
    - name: Deploy to GitHub Pages
      run: USE_SSH=true npm run deploy -- --skip-build
