name: Deploy Docusaurus site to GitHub Pages

on:
  push:
    branches:
      - main  # 当 main 分支有推送时触发部署
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean install dependencies
      run: |
        rm -rf node_modules
        npm ci

    # Frontend only: App ID + Search-Only key (never Admin / Write key here)
    - name: Build Docusaurus site
      env:
        ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
        ALGOLIA_SEARCH_API_KEY: ${{ secrets.ALGOLIA_SEARCH_API_KEY }}
        # Index name is not confidential; default matches docusaurus.config.js
        ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME || 'rdk_doc_center' }}
      run: npm run build

    # Admin key scoped to this step only — do not echo or pass to build/deploy
    - name: Update Algolia index
      env:
        ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
        ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
        ALGOLIA_INDEX_NAME: ${{ vars.ALGOLIA_INDEX_NAME || 'rdk_doc_center' }}
      run: npm run algolia:index

    - name: Set up Git config
      run: |
        git config --global user.email "liql01@qq.com"
        git config --global user.name "liqinglian01"

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts

    - name: Deploy to GitHub Pages
      run: USE_SSH=true npm run deploy
