name: Sync gh-pages to OSS

on:
  # OSS 上传已改由 deploy.yml 在 build 后直接同步（含 build/en/）。
  # 此处仅保留手动触发，避免从 stale 的 gh-pages 覆盖 OSS。
  workflow_dispatch:

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0   # 拉取完整历史，保证可以 push

      - name: Setup ossutil v2
        run: |
          # 下载并设置 ossutil v2
          curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
          unzip ossutil.zip
          cd ossutil-2.1.2-linux-amd64
          chmod 755 ossutil
          mv ossutil /usr/local/bin/ && sudo ln -s /usr/local/bin/ossutil /usr/bin/ossutil
          ossutil version

      - name: Upload to OSS via Custom Domain
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          # 直接使用命令行参数，避免配置步骤
          sudo ossutil cp -r . oss://cn-rdk-front-prod/rdk_doc_center/ \
          -e https://d-robotics.cc \
          -i $OSS_ACCESS_KEY_ID \
          -k $OSS_ACCESS_KEY_SECRET \
          --region cn-beijing \
          --update \
          --retry-times=3
      - name: Show OSS Report
        if: failure()
        run: |
          cat ossutil_output/*.report